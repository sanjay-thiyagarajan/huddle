[project]
name = "huddle"
version = "0.1.0"
description = "Private group-decision agent (MCP server + simulator)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.23,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "httpx>=0.27",
  "scipy>=1.11",
]

[project.optional-dependencies]
voice = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2", "soundfile>=0.12", "faster-whisper>=1.0"]
aws = ["strands-agents>=1.0", "boto3>=1.34"]
dev = ["aiosmtpd>=1.4", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff.lint.per-file-ignores]
"tests/voice_eval.py" = ["E501"]  # long lines are report prose
"server/agent/dialogue.py" = ["E501"]  # long lines are spoken prose
"tests/family_sim.py" = ["E501"]  # long lines are report prose
"server/engine/home.py" = ["E501"]  # long lines are user-facing prose
"server/agent/chore_agent.py" = ["E501"]  # long lines are regexes and spoken prose
"server/agent/prompts.py" = ["E501"]  # prompts are prose
"server/mcp_server.py" = ["E501"]  # tool descriptions are prose
