name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUDDLE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check server tests scripts
      - name: Tests (includes the privacy leak test)
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    env:
      HUDDLE_MODE: mock
      HUDDLE_UVICORN: uvicorn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web
      - name: Browser tests (demo flows, failure path, phone width, accessibility)
        run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t huddle .
      - name: Container serves the app
        run: |
          docker run -d --name huddle -p 8000:8000 huddle
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          curl -sf -o /dev/null localhost:8000/
