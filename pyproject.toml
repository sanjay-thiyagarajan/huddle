[project]
name = "huddle"
version = "0.1.0"
description = "Private group-decision agent (MCP server + simulator)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.23,<2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "httpx>=0.27",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]
